services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/daniilren/lawsuit-bot:latest
    container_name: company_info_bot
    # network_mode: "host"
    env_file:
      - .env
    environment:
      - PARSER_API_URL=http://company_parser_api:5050
      - WHITELIST_FILE=/app/whitelist.txt
      - PROXY_URL=${PROXY_URL}
    volumes:
      - bot_data:/data
      - ./whitelist.txt:/app/whitelist.txt
    networks:
      - parser-net
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"

networks:
  parser-net:
    external: true

volumes:
  bot_data: