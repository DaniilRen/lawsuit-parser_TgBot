services:
  bot:
    build: .
    container_name: company_info_bot
    env_file:
      - .env
    volumes:
      - ./logs:/app/logs
      - ./bot_data.db:/app/bot_data.db
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - bot_network

networks:
  bot_network:
    driver: bridge